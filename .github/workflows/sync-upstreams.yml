name: Sync Upstreams

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync vendored upstreams
        run: |
          bash scripts/sync-upstreams.sh

      - name: Push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet origin/main HEAD; then
            echo "Nothing to push."
            exit 0
          fi
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/sphinxcode/hermes-all-in-one.git" main
